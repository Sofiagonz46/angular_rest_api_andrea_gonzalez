<mat-toolbar class="header">
  <a class="logo" routerLink="/home">
    <mat-icon>public</mat-icon>
    <span>Anime Dex</span>
  </a>

  <nav class="links">
    @for (link of links; track link.path) {
      <a mat-button [routerLink]="link.path" routerLinkActive="active">{{ link.label }}</a>
    }
  </nav>

  <span class="spacer"></span>

  <button mat-icon-button (click)="theme.toggle()" aria-label="Cambiar tema">
    <mat-icon>{{ theme.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>

  <button mat-icon-button class="menu-button" [matMenuTriggerFor]="menu" aria-label="Abrir menú">
    <mat-icon>menu</mat-icon>
  </button>
  <mat-menu #menu="matMenu">
    @for (link of links; track link.path) {
      <a mat-menu-item [routerLink]="link.path">{{ link.label }}</a>
    }
  </mat-menu>
</mat-toolbar>

<main>
  <router-outlet />
</main>
